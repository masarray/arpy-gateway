name: Modbus Engine - Issue 6
on:
  push:
    branches: ['feat/6-modbus-*']
  pull_request:
    paths:
      - 'src/arpy_gateway/adapters/modbus/**'
      - 'tests/modbus/**'
      - '.github/workflows/modbus.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protocol-tests:
    name: ${{ matrix.os }} Python ${{ matrix.python-version }} / transport interop
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned optional Modbus transport
        run: python -m pip install "pymodbus[serial]==3.15.0"
      - name: Check PyModbus compatibility
        run: python -c "import pymodbus; assert pymodbus.__version__ == '3.15.0'"
      - name: Compile Modbus adapter and tests
        run: python -m compileall -q src/arpy_gateway/adapters/modbus tests/modbus
      - name: Run all Modbus loopback / independent client tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests/modbus -p 'test_*.py' -v
      - name: Ensure adapter is independent of GUI Qt imports
        env:
          PYTHONPATH: src
        run: python -c "import sys; import arpy_gateway.adapters.modbus; assert not any(x.startswith(('PySide','PyQt')) for x in sys.modules)"
