name: Foundation - Contracts
on:
  push:
    branches: [main, 'architecture/**', 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile pure Python
        run: python -m compileall -q src tests
      - name: Install CI-only schema validator
        run: python -m pip install 'jsonschema==4.23.0'
      - name: Validate schemas and example fixture
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          for path in Path("contracts").glob("*.schema.json"):
              Draft202012Validator.check_schema(json.loads(path.read_text()))
          schema = json.loads(Path("contracts/project.v1.schema.json").read_text())
          fixture = json.loads(Path("examples/projects/modbus-client-to-iec104-server.v1.json").read_text())
          Draft202012Validator(schema).validate(fixture)
          print("Schema and fixture valid")
          PY
      - name: Run pure domain tests (without Qt)
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_contracts.py' -v
      - name: Assert runtime ports import without GUI
        env:
          PYTHONPATH: src
        run: python -c 'import arpy_gateway.domain, arpy_gateway.contracts, arpy_gateway.runtime.ports; print("import OK")'
