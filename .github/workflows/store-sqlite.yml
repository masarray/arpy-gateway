name: Store SQLite Revisions - Issue 3
on:
  push:
    branches: ['feat/store-*']
  pull_request:
    paths:
      - 'src/arpy_gateway/engineering/**'
      - 'tests/test_store_v1.py'
      - '.github/workflows/store-sqlite.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  store:
    name: SQLite Store ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python: ['3.10','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile pure Python store
        run: python -m compileall -q src/arpy_gateway/engineering tests/test_store_v1.py
      - name: Run Store transactions, staging and 100k indexed capacity
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_store_v1.py' -v
      - name: Assert no Qt, network or adapter runtime imported
        env:
          PYTHONPATH: src
        run: python -c "import sys, arpy_gateway.engineering; assert not any(n.startswith(('PySide6','pymodbus','arpy_gateway.studio','arpy_gateway.ipc')) for n in sys.modules)"
  capacity-500k:
    # Already accepted in Linux CI; run again on manual final verification,
    # not on every Windows-first development commit.
    if: github.event_name == 'workflow_dispatch'
    name: Real 500k SQLite Row + Indexed Last Page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Persist 500,000 signals, index, read last records
        env:
          PYTHONPATH: src
          ARPY_STORE_BENCH_500K: '1'
        run: python -m unittest discover -s tests -p 'test_store_v1.py' -v
