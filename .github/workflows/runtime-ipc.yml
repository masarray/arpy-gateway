name: Headless Runtime IPC - Issue 8
on:
  push:
    branches: ['feat/8-*']
  pull_request:
    paths:
      - 'src/arpy_gateway/ipc/**'
      - 'src/arpy_gateway/runtime/service/**'
      - 'tests/ipc/**'
      - '.github/workflows/runtime-ipc.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ${{ matrix.os }}
    name: Headless IPC ${{ matrix.os }} Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile headless modules
        run: python -m compileall -q src/arpy_gateway/ipc src/arpy_gateway/runtime/service tests/ipc
      - name: Execute multi-process IPC regression
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests/ipc -p 'test_*.py' -v
      - name: Confirm no Qt or PyModbus runtime dependency
        env:
          PYTHONPATH: src
        run: python -c "import sys, arpy_gateway.ipc.server, arpy_gateway.runtime.service.fixture; assert not any(k.startswith(('PySide6', 'PyQt', 'pymodbus')) for k in sys.modules)"
