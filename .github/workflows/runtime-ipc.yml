name: Headless Runtime IPC - Issue 8
on:
  push:
    branches: ['feat/8-*']
  pull_request:
    paths:
      - 'src/arpy_gateway/ipc/**'
      - 'src/arpy_gateway/runtime/service/**'
      - 'tests/ipc/**'
      - '.github/workflows/runtime-ipc.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ${{ matrix.os }}
    name: Headless IPC ${{ matrix.os }} Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile headless modules
        run: python -m compileall -q src/arpy_gateway/ipc src/arpy_gateway/runtime/service tests/ipc
      - name: Execute multi-process IPC regression
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests/ipc -p 'test_*.py' -v
      - name: Confirm no Qt or PyModbus runtime dependency
        env:
          PYTHONPATH: src
        run: python -c "import sys, arpy_gateway.ipc.server, arpy_gateway.runtime.service.fixture; assert not any(k.startswith(('PySide6', 'PyQt', 'pymodbus')) for k in sys.modules)"

  modbus-wire:
    name: P8.3 actual Modbus TCP to headless IPC / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Overlay pinned Modbus adapter PR #15 without merging it
        shell: bash
        run: |
          git fetch --no-tags origin feat/6-modbus-async-engine
          pinned="cb94de62d49bdb3c3151f7cd472311911442f241"
          test "$(git rev-parse FETCH_HEAD)" = "$pinned"
          git checkout "$pinned" -- src/arpy_gateway/adapters/modbus
          echo "Modbus public adapter overlaid at $pinned for interop CI only"
      - name: Install protocol transport on BUILD RUNNER ONLY
        run: python -m pip install "pymodbus[serial]==3.15.0"
      - name: Validate pinned dependency
        run: python -m pip check
      - name: Run actual socket interop and separate-process tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests/ipc -p 'test_modbus_runtime_integration.py' -v
      - name: Run all IPC unit/lifecycle tests on combined integration source
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests/ipc -p 'test_*.py' -v
