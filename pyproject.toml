[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arpy-gateway"
version = "0.1.0"
description = "Cross-platform industrial protocol gateway — high-performance signal engineering studio"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.8,<7"]

[project.scripts]
arpy-studio = "arpy_gateway.studio.app:main"
arpy-benchmark = "arpy_gateway.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
