[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arpy-gateway"
version = "0.1.0"
description = "Modular Python industrial protocol gateway and independent engineering Studio"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
studio = ["PySide6>=6.8,<7"]

[project.scripts]
arpy-studio = "arpy_gateway.studio.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
